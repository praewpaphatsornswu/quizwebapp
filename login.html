<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | quizWeb</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
    <div class="container nav-inner">
        <div class="logo" onclick="location.href='index.html'">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
            <div class="logo-text">
                <strong>quizWeb</strong>
                <span>สร้าง &bull; แชร์ &bull; เล่นควิซออนไลน์</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="auth-area">
                <div id="profileMenuWrap" class="profile-menu-wrap">
                    <button id="profilePill" class="profile-pill" type="button">
                        <div class="profile-avatar">
                            <span class="profile-avatar-fallback" id="navAvatarFallback">U</span>
                            <img id="navAvatarImg" alt="user avatar" style="display:none;">
                        </div>
                        <div class="profile-pill-text">
                            <strong id="navUserName">ผู้ใช้</strong>
                            <span>กดเพื่อเปิดเมนู</span>
                        </div>
                        <div class="profile-pill-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </div>
                    </button>

                    <div class="profile-dropdown">
                        <button class="dropdown-item" type="button" onclick="goDashboard()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            <span>ไปคลังข้อสอบ</span>
                        </button>
                        <button class="dropdown-item" type="button" onclick="openAvatarModal()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                            <span>เปลี่ยนรูปโปรไฟล์</span>
                        </button>
                        <button class="dropdown-item" id="adminMenuItem" type="button" style="display:none;" onclick="window.location.href='/admin.html'">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2l8 4v6c0 5-3.5 9.5-8 10-4.5-.5-8-5-8-10V6l8-4z"/>
                                <path d="M9 12l2 2 4-4"/>
                            </svg>
                            <span>Admin Panel</span>
                        </button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger" type="button" onclick="handleLogout()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>
                </div>

                <button id="loginBtn" class="solid-btn login-inline-btn" type="button" onclick="goLogin()">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>
</nav>

    <!-- PAGE -->
    <div class="page">
        <div class="login-card">
            <div class="login-header">
                <h1>เข้าสู่ระบบ</h1>
                <p>ใส่ username และ password เพื่อเข้าสู่ระบบ</p>
            </div>

            <form id="loginForm">
                <div class="field-group">
                    <label class="field-label" for="username">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Username
                    </label>
                    <input class="field-input" type="text" id="username" placeholder="ชื่อผู้ใช้ของคุณ" required>
                </div>

                <div class="field-group">
                    <label class="field-label" for="password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Password
                    </label>
                    <input class="field-input" type="password" id="password" placeholder="รหัสผ่านของคุณ" required>
                    <div class="error-text" id="loginError"></div>
                </div>

                <button class="btn-submit" type="submit">เข้าสู่ระบบ</button>
            </form>

            <div class="login-footer">
                <p>ยังไม่มีบัญชี? <a href="register.html" class="link-register">สมัครสมาชิก</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/login_func.js"></script>

</body>
</html>
