<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — quizWeb</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="ambient-wrap" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="particles" aria-hidden="true">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
</div>

<nav>
    <div class="container nav-inner">
        <div class="logo" onclick="goHome()">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
            <div class="logo-text">
                <strong>quizWeb</strong>
                <span>สร้าง &bull; แชร์ &bull; เล่นควิซออนไลน์</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="auth-area">
                <div id="profileMenuWrap" class="profile-menu-wrap">
                    <button id="profilePill" class="profile-pill" type="button">
                        <div class="profile-avatar">
                            <span class="profile-avatar-fallback" id="navAvatarFallback">U</span>
                            <img id="navAvatarImg" alt="user avatar" style="display:none;">
                        </div>
                        <div class="profile-pill-text">
                            <strong id="navUserName">ผู้ใช้</strong>
                            <span>กดเพื่อเปิดเมนู</span>
                        </div>
                        <div class="profile-pill-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </div>
                    </button>

                    <div class="profile-dropdown">
                        <button class="dropdown-item" type="button" onclick="goHome()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                            <span>หน้าหลัก</span>
                        </button>
                        <button class="dropdown-item" type="button" onclick="openAvatarModal()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="8" r="4"/>
                                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                            </svg>
                            <span>เปลี่ยนรูปโปรไฟล์</span>
                        </button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger" type="button" onclick="handleLogout()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </svg>
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>
                </div>

                <button id="loginBtn" class="solid-btn login-inline-btn" type="button" onclick="goLogin()">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>
</nav>

<main class="page">
    <div class="page-header reveal">
        <div class="page-header-left">
            <div class="page-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                คลังข้อสอบของฉัน
            </div>
            <h1>Dashboard</h1>
            <p>จัดการและดูสถิติข้อสอบทั้งหมดของคุณ</p>
        </div>
        <button class="solid-btn btn-glow" onclick="goCreate()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:17px;height:17px;">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            สร้างควิซใหม่
        </button>
    </div>

    <div id="quizContainer"></div>
</main>

<!-- Modal เปลี่ยนรูปโปรไฟล์ — เหมือน index.html ทุกอย่าง -->
<div class="modal" id="avatarModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>ตั้งค่ารูปโปรไฟล์</h3>
            <button class="close-btn" type="button" onclick="closeAvatarModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="modal-body">
            <div class="preview-wrap">
                <div class="preview-avatar">
                    <span class="preview-fallback" id="previewFallback">U</span>
                    <img id="previewImg" alt="preview avatar" style="display:none;">
                </div>
            </div>

            <div class="field">
                <label>1. เลือกรูปจากแกลเลอรี่</label>
                <input type="file" id="avatarFileInput" accept="image/*">
            </div>

            <div class="field">
                <label>2. วางลิงก์รูปภาพ</label>
                <input type="url" id="avatarUrlInput" placeholder="วางลิงก์รูป เช่น https://...">
                <small>ใช้ได้กับลิงก์รูปทั่วไป หรือรูปจาก Google Drive ที่เปิดแชร์สาธารณะแล้ว</small>
            </div>

            <div class="upload-actions">
                <button class="outline-btn" type="button" onclick="applyUrlAvatar()">ใช้ลิงก์รูปนี้</button>
                <button class="ghost-btn" type="button" onclick="resetAvatarToDefault()">ลบรูปโปรไฟล์</button>
            </div>

            <div class="modal-footer-row">
                <button class="ghost-btn" type="button" onclick="closeAvatarModal()">ปิด</button>
            </div>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/dashboard_func.js"></script>
</body>
</html>
