<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังข้อสอบ | quizWeb</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Prompt',sans-serif;
}

:root{
    --bg:#f5fffb;
    --bg2:#ecfff6;
    --primary:#1f7a5a;
    --primary-dark:#14513d;
    --primary-soft:#dff7ec;
    --text:#123126;
    --text-soft:#4f6b61;
    --white:#ffffff;
    --border:rgba(31,122,90,0.15);
    --shadow:0 10px 30px rgba(25,80,61,0.10);
    --shadow-lg:0 20px 45px rgba(25,80,61,0.15);
    --danger:#d64545;
}

body{
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(circle at top left, #dff9ee 0%, transparent 28%),
        radial-gradient(circle at bottom right, #d8f5ff 0%, transparent 24%),
        linear-gradient(135deg, var(--bg), #ffffff 52%, var(--bg2) 100%);
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1200px, calc(100% - 32px));
    margin:0 auto;
}

nav{
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,0.82);
    border-bottom:1px solid rgba(31,122,90,0.08);
}

.nav-inner{
    min-height:78px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}

.logo-badge{
    width:42px;
    height:42px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--primary), #3bb789);
    color:white;
    display:grid;
    place-items:center;
    font-size:20px;
    box-shadow:var(--shadow);
}

.logo-text{
    display:flex;
    flex-direction:column;
    line-height:1.1;
}

.logo-text strong{
    font-size:22px;
    color:var(--primary-dark);
}

.logo-text span{
    font-size:12px;
    color:var(--text-soft);
}

.nav-right{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.nav-links a{
    padding:10px 14px;
    border-radius:12px;
    font-weight:500;
    color:var(--text);
    transition:0.2s ease;
}

.nav-links a:hover{
    background:rgba(31,122,90,0.08);
    color:var(--primary-dark);
}

.auth-area{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
}

.profile-menu-wrap{
    position:relative;
    display:none;
}

.profile-menu-wrap.show{
    display:block;
}

.profile-pill{
    min-width:290px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:999px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.95);
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:0.2s ease;
}

.profile-pill:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow-lg);
}

.profile-avatar{
    width:74px;
    height:74px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    border:4px solid white;
    background:linear-gradient(135deg, #d9f7eb, #ecfff6);
    display:grid;
    place-items:center;
    box-shadow:0 8px 18px rgba(18,49,38,0.10);
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-avatar-fallback{
    font-size:26px;
    font-weight:700;
    color:var(--primary-dark);
}

.profile-pill-text{
    display:flex;
    flex-direction:column;
    min-width:0;
    flex:1;
    line-height:1.2;
}

.profile-pill-text strong{
    font-size:23px;
    color:var(--primary-dark);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-pill-text span{
    font-size:14px;
    color:var(--text-soft);
}

.profile-pill-arrow{
    font-size:18px;
    color:var(--primary-dark);
    transition:transform 0.2s ease;
    flex-shrink:0;
}

.profile-menu-wrap.open .profile-pill-arrow{
    transform:rotate(180deg);
}

.profile-dropdown{
    position:absolute;
    top:calc(100% + 12px);
    right:0;
    width:260px;
    background:white;
    border:1px solid rgba(31,122,90,0.12);
    border-radius:20px;
    box-shadow:0 20px 45px rgba(20,81,61,0.15);
    padding:10px;
    display:none;
    z-index:120;
}

.profile-menu-wrap.open .profile-dropdown{
    display:block;
}

.dropdown-item{
    width:100%;
    border:none;
    background:white;
    padding:14px 14px;
    border-radius:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    color:var(--text);
    font-size:15px;
    font-weight:500;
    transition:0.2s ease;
}

.dropdown-item:hover{
    background:#f4fbf7;
}

.dropdown-item.danger{
    color:var(--danger);
}

.dropdown-divider{
    height:1px;
    background:rgba(31,122,90,0.08);
    margin:8px 4px;
}

.solid-btn,
.outline-btn,
.ghost-btn{
    border:none;
    cursor:pointer;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    transition:0.2s ease;
}

.solid-btn{
    background:linear-gradient(135deg, var(--primary), #2ea777);
    color:white;
    padding:13px 20px;
    box-shadow:0 10px 25px rgba(31,122,90,0.22);
}

.solid-btn:hover{
    transform:translateY(-1px);
    filter:brightness(0.98);
}

.outline-btn{
    background:white;
    color:var(--primary-dark);
    border:1.5px solid rgba(31,122,90,0.22);
    padding:12px 18px;
}

.outline-btn:hover{
    background:var(--primary-soft);
}

.ghost-btn{
    background:transparent;
    color:var(--primary-dark);
    padding:10px 14px;
}

.ghost-btn:hover{
    background:rgba(31,122,90,0.08);
}

.login-inline-btn{
    display:none;
}

.login-inline-btn.show{
    display:inline-flex;
}

/* page */
.page{
    max-width:1200px;
    margin:30px auto 40px;
    padding:0 24px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
}

.header h1{
    color:#1b4332;
    font-size:34px;
}

.header p{
    color:#52796f;
    margin-top:6px;
}

.btn{
    border:none;
    border-radius:12px;
    padding:12px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:0.2s;
}

.btn-primary{
    background:#52b788;
    color:#fff;
}

.btn-primary:hover{
    background:#40916c;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
    padding:22px;
    position:relative;
}

.card-title{
    font-size:22px;
    font-weight:600;
    color:#1b4332;
    margin-bottom:12px;
    padding-right:80px;
}

.info{
    display:grid;
    gap:10px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    background:#f7fbf8;
    padding:10px 12px;
    border-radius:12px;
    color:#2d6a4f;
    font-size:14px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.btn-light{
    background:#fff;
    color:#2d6a4f;
    border:1px solid #cfe9db;
}

.btn-light:hover{
    background:#f7fffb;
}

.btn-danger{
    background:#e63946;
    color:#fff;
}

.btn-danger:hover{
    background:#c1121f;
}

.badge-new{
    position:absolute;
    top:16px;
    right:16px;
    background:#d8f3dc;
    color:#2d6a4f;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
}

.empty{
    text-align:center;
    background:#fff;
    border-radius:20px;
    padding:50px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
    color:#52796f;
}

.empty h2{
    color:#1b4332;
    margin-bottom:10px;
}

@media (max-width:1100px){
    .profile-pill{
        min-width:240px;
        padding:12px 14px;
    }

    .profile-avatar{
        width:62px;
        height:62px;
    }

    .profile-pill-text strong{
        font-size:19px;
    }
}

@media (max-width:768px){
    .nav-inner{
        padding:14px 0;
        align-items:flex-start;
        flex-direction:column;
    }

    .nav-right{
        width:100%;
        justify-content:space-between;
        align-items:flex-start;
    }

    .nav-links{
        gap:6px;
    }

    .nav-links a{
        padding:9px 12px;
        font-size:14px;
    }

    .profile-pill{
        min-width:100%;
        width:100%;
    }

    .profile-dropdown{
        width:100%;
    }

    .page{
        padding:0 14px;
    }

    .header h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="container nav-inner">
        <div class="logo" onclick="goHome()">
            <div class="logo-badge">🧠</div>
            <div class="logo-text">
                <strong>quizWeb</strong>
                <span>สร้าง • แชร์ • เล่นควิซออนไลน์</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="auth-area">
                <div id="profileMenuWrap" class="profile-menu-wrap">
                    <button id="profilePill" class="profile-pill" type="button">
                        <div class="profile-avatar">
                            <span class="profile-avatar-fallback" id="navAvatarFallback">U</span>
                            <img id="navAvatarImg" alt="user avatar" style="display:none;">
                        </div>

                        <div class="profile-pill-text">
                            <strong id="navUserName">ผู้ใช้</strong>
                            <span>กดเพื่อเปิดเมนู</span>
                        </div>

                        <div class="profile-pill-arrow">▾</div>
                    </button>

                    <div class="profile-dropdown">
                        <button class="dropdown-item" type="button" onclick="goDashboard()">
                            <span>📚</span>
                            <span>ไปคลังข้อสอบ</span>
                        </button>

                        <button class="dropdown-item" type="button" onclick="goCreate()">
                            <span>📝</span>
                            <span>สร้างควิซ</span>
                        </button>

                        <div class="dropdown-divider"></div>

                        <button class="dropdown-item danger" type="button" onclick="handleLogout()">
                            <span>🚪</span>
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>
                </div>

                <button id="loginBtn" class="solid-btn login-inline-btn" type="button" onclick="goLogin()">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>
</nav>

<div class="page">
    <div class="header">
        <div>
            <h1>คลังข้อสอบของฉัน</h1>
            <p>รวมข้อสอบที่คุณสร้างไว้ทั้งหมด พร้อมสถิติผู้เล่น</p>
        </div>

        <button class="btn btn-primary" onclick="window.location.href='create.html'">+ สร้างควิซใหม่</button>
    </div>

    <div id="quizContainer"></div>
</div>

<script src="auth.js"></script>
<script>
if (!requireLogin()) {
    throw new Error("User not logged in");
}

loadUserUI();

const currentUser = getUser();
const params = new URLSearchParams(window.location.search);
const newCode = params.get("new");

function goHome(){
    window.location.href = "index.html";
}

function goDashboard(){
    window.location.href = "dashboard.html";
}

function goCreate(){
    window.location.href = "create.html";
}

function goLogin(){
    window.location.href = "login.html";
}

function getCurrentUserSafe() {
    try {
        if (typeof getUser === "function") {
            return getUser();
        }
    } catch (e) {}
    return null;
}

function getDisplayName(user) {
    if (!user) return "ผู้ใช้";
    return user.name || user.username || user.email || "ผู้ใช้";
}

function getUserId(user) {
    if (!user) return "guest";
    return user.id || user.email || user.username || user.name || "guest";
}

function getInitial(name) {
    if (!name || typeof name !== "string") return "U";
    return name.trim().charAt(0).toUpperCase();
}

function avatarStorageKey(user) {
    return "quizweb_avatar_" + getUserId(user);
}

function getSavedAvatar(user) {
    return localStorage.getItem(avatarStorageKey(user)) || "";
}

function setImageOrFallback(imgEl, fallbackEl, src, fallbackText) {
    if (src) {
        imgEl.src = src;
        imgEl.style.display = "block";
        fallbackEl.style.display = "none";
    } else {
        imgEl.removeAttribute("src");
        imgEl.style.display = "none";
        fallbackEl.textContent = fallbackText;
        fallbackEl.style.display = "block";
    }
}

function renderNavbarProfile() {
    const user = getCurrentUserSafe();
    const isLoggedIn = !!user;
    const name = getDisplayName(user);
    const avatar = getSavedAvatar(user);
    const initial = getInitial(name);

    const profileMenuWrap = document.getElementById("profileMenuWrap");
    const loginBtn = document.getElementById("loginBtn");
    const navUserName = document.getElementById("navUserName");
    const navAvatarImg = document.getElementById("navAvatarImg");
    const navAvatarFallback = document.getElementById("navAvatarFallback");

    if (isLoggedIn) {
        profileMenuWrap.classList.add("show");
        loginBtn.classList.remove("show");
        navUserName.textContent = name;
    } else {
        profileMenuWrap.classList.remove("show");
        profileMenuWrap.classList.remove("open");
        loginBtn.classList.add("show");
    }

    setImageOrFallback(navAvatarImg, navAvatarFallback, avatar, initial);
}

function toggleProfileMenu() {
    const wrap = document.getElementById("profileMenuWrap");
    wrap.classList.toggle("open");
}

function closeProfileMenu() {
    document.getElementById("profileMenuWrap").classList.remove("open");
}

function handleLogout() {
    closeProfileMenu();

    if (typeof logout === "function") {
        logout();
        return;
    }

    localStorage.removeItem("loggedInUser");
    localStorage.removeItem("currentUser");
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

function escapeHtml(text){
    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getQuizStats(quizCode){
    const quizResults = JSON.parse(localStorage.getItem("quizResults")) || [];
    const records = quizResults.filter(r => r.quizCode === quizCode);

    if (records.length === 0) {
        return { players: 0, avg: 0, max: 0, min: 0 };
    }

    const bestPercents = records.map(r => Number(r.bestPercent) || 0);
    const sum = bestPercents.reduce((a, b) => a + b, 0);

    return {
        players: records.length,
        avg: Math.round(sum / bestPercents.length),
        max: Math.max(...bestPercents),
        min: Math.min(...bestPercents)
    };
}

function loadQuizzes(){
    const container = document.getElementById("quizContainer");
    let quizzes = JSON.parse(localStorage.getItem("myQuizzes")) || [];

    quizzes = quizzes.filter(q => q.owner === currentUser.username);

    if (quizzes.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <h2>ยังไม่มีข้อสอบ</h2>
                <p>เริ่มสร้างข้อสอบแรกของคุณได้เลย</p>
            </div>
        `;
        return;
    }

    let html = `<div class="grid">`;

    quizzes.forEach(q => {
        if (q.allowReview == null) q.allowReview = true;

        const minutes = Math.floor((q.time || 0) / 60);
        const seconds = (q.time || 0) % 60;
        const stats = getQuizStats(q.code);

        html += `
            <div class="card">
                ${q.code === newCode ? `<div class="badge-new">ใหม่</div>` : ""}

                <div class="card-title">${escapeHtml(q.title || "ไม่มีชื่อควิซ")}</div>

                <div class="info">
                    <div class="info-row">
                        <span>รหัสข้อสอบ</span>
                        <strong>${escapeHtml(q.code)}</strong>
                    </div>

                    <div class="info-row">
                        <span>จำนวนข้อ</span>
                        <strong>${q.questions ? q.questions.length : 0} ข้อ</strong>
                    </div>

                    <div class="info-row">
                        <span>เวลา</span>
                        <strong>${minutes} นาที ${seconds} วินาที</strong>
                    </div>

                    <div class="info-row">
                        <span>วันที่สร้าง</span>
                        <strong>${escapeHtml(q.createdAt || "-")}</strong>
                    </div>

                    <div class="info-row">
                        <span>จำนวนครั้งที่เล่นได้</span>
                        <strong>${Number(q.attemptsLimit) === 0 ? "ไม่จำกัด" : `${q.attemptsLimit} ครั้ง`}</strong>
                    </div>

                    <div class="info-row">
                        <span>Review</span>
                        <strong>${q.allowReview ? "อนุญาต" : "ไม่อนุญาต"}</strong>
                    </div>

                    <div class="info-row">
                        <span>ผู้เล่น</span>
                        <strong>${stats.players} คน</strong>
                    </div>

                    <div class="info-row">
                        <span>Average</span>
                        <strong>${stats.avg}%</strong>
                    </div>

                    <div class="info-row">
                        <span>Max</span>
                        <strong>${stats.max}%</strong>
                    </div>

                    <div class="info-row">
                        <span>Min</span>
                        <strong>${stats.min}%</strong>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-light" onclick="editQuiz('${q.code}')">แก้ไข</button>
                    <button class="btn btn-primary" onclick="playQuiz('${q.code}')">เล่น/ทดลองเล่น</button>
                    <button class="btn btn-danger" onclick="deleteQuiz('${q.code}')">ลบ</button>
                </div>
            </div>
        `;
    });

    html += `</div>`;
    container.innerHTML = html;
}

function editQuiz(code){
    window.location.href = `edit.html?code=${code}`;
}

function playQuiz(code){
    window.location.href = `play.html?code=${code}`;
}

function deleteQuiz(code){
    const ok = confirm("ต้องการลบข้อสอบนี้ใช่ไหม?");
    if (!ok) return;

    let quizzes = JSON.parse(localStorage.getItem("myQuizzes")) || [];
    quizzes = quizzes.filter(q => !(q.code === code && q.owner === currentUser.username));
    localStorage.setItem("myQuizzes", JSON.stringify(quizzes));

    let quizResults = JSON.parse(localStorage.getItem("quizResults")) || [];
    quizResults = quizResults.filter(r => r.quizCode !== code);
    localStorage.setItem("quizResults", JSON.stringify(quizResults));

    loadQuizzes();
}

const profilePill = document.getElementById("profilePill");
if (profilePill) {
    profilePill.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleProfileMenu();
    });
}

document.addEventListener("click", function (e) {
    const wrap = document.getElementById("profileMenuWrap");
    if (wrap && !wrap.contains(e.target)) {
        closeProfileMenu();
    }
});

renderNavbarProfile();
loadQuizzes();
</script>

</body>
</html>
