<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังข้อสอบ | quizWeb</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<nav>
    <div class="container nav-inner">
        <div class="logo" onclick="goHome()">
            <div class="logo-badge">🧠</div>
            <div class="logo-text">
                <strong>quizWeb</strong>
                <span>สร้าง • แชร์ • เล่นควิซออนไลน์</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="auth-area">
                <div id="profileMenuWrap" class="profile-menu-wrap">
                    <button id="profilePill" class="profile-pill" type="button">
                        <div class="profile-avatar">
                            <span class="profile-avatar-fallback" id="navAvatarFallback">U</span>
                            <img id="navAvatarImg" alt="user avatar" style="display:none;">
                        </div>

                        <div class="profile-pill-text">
                            <strong id="navUserName">ผู้ใช้</strong>
                            <span>กดเพื่อเปิดเมนู</span>
                        </div>

                        <div class="profile-pill-arrow">▾</div>
                    </button>

                    <div class="profile-dropdown">
                        <button class="dropdown-item" type="button" onclick="goDashboard()">
                            <span>📚</span>
                            <span>ไปคลังข้อสอบ</span>
                        </button>

                        <button class="dropdown-item" type="button" onclick="goCreate()">
                            <span>📝</span>
                            <span>สร้างควิซ</span>
                        </button>

                        <button class="dropdown-item" id="adminMenuItem" type="button" style="display:none;" onclick="window.location.href='admin.html'">
                            <span>🛡️</span>
                            <span>Admin Panel</span>
                        </button>

                        <div class="dropdown-divider"></div>

                        <button class="dropdown-item danger" type="button" onclick="handleLogout()">
                            <span>🚪</span>
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>
                </div>

                <button id="loginBtn" class="solid-btn login-inline-btn" type="button" onclick="goLogin()">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>
</nav>

<div class="page">
    <div class="header">
        <div>
            <h1>คลังข้อสอบของฉัน</h1>
            <p>รวมข้อสอบที่คุณสร้างไว้ทั้งหมด พร้อมสถิติผู้เล่น</p>
        </div>

        <button class="btn btn-primary" onclick="window.location.href='create.html'">+ สร้างควิซใหม่</button>
    </div>

    <div id="quizContainer"></div>
</div>

<script src="js/auth.js"></script>
<script src="js/dashboard_func.js"></script>

</body>
</html>
