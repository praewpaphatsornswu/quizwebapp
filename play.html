<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Player | quizWeb</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css">
</head>
<body>

<!-- Blobs -->
<div class="ambient-wrap" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<!-- Particles -->
<div class="particles" id="particles"></div>

<nav>
    <div class="container nav-inner">
        <div class="logo" onclick="goHome()">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
            <div class="logo-text">
                <strong>quizWeb</strong>
                <span>สร้าง &bull; แชร์ &bull; เล่นควิซออนไลน์</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="auth-area">
                <div id="profileMenuWrap" class="profile-menu-wrap">
                    <button id="profilePill" class="profile-pill" type="button">
                        <div class="profile-avatar">
                            <span class="profile-avatar-fallback" id="navAvatarFallback">U</span>
                            <img id="navAvatarImg" alt="user avatar" style="display:none;">
                        </div>
                        <div class="profile-pill-text">
                            <strong id="navUserName">ผู้ใช้</strong>
                            <span>กดเพื่อเปิดเมนู</span>
                        </div>
                        <div class="profile-pill-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </div>
                    </button>

                    <div class="profile-dropdown">
                        <button class="dropdown-item" type="button" onclick="goDashboard()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            <span>ไปคลังข้อสอบ</span>
                        </button>
                        <button class="dropdown-item" type="button" onclick="goCreate()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                            <span>สร้างควิซ</span>
                        </button>
                        <button class="dropdown-item" id="adminMenuItem" type="button" style="display:none;" onclick="window.location.href='/admin.html'">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2l8 4v6c0 5-3.5 9.5-8 10-4.5-.5-8-5-8-10V6l8-4z"/>
                                <path d="M9 12l2 2 4-4"/>
                            </svg>
                            <span>Admin Panel</span>
                        </button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger" type="button" onclick="handleLogout()">
                            <svg class="di-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>
                </div>

                <button id="loginBtn" class="solid-btn login-inline-btn" type="button" onclick="goLogin()">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>
</nav>

<!-- Page content -->
<div class="page-wrapper">

    <div id="previewBanner" class="preview-banner" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        คุณกำลังอยู่ในโหมดทดลองเล่นสำหรับผู้สร้าง คะแนนครั้งนี้จะไม่ถูกนับเป็นสถิติ
    </div>

    <!-- Top Card -->
    <div class="top-section">
        <div class="top-card">
            <div class="top-header">
                <div class="quiz-info-block">
                    <div class="quiz-title-row">
                        <div class="quiz-title-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div>
                            <div class="quiz-title" id="quizTitle">Quiz</div>
                            <div class="quiz-subtitle" id="quizSubtitle">พร้อมเริ่มทำควิซ</div>
                        </div>
                    </div>
                </div>

                <div class="timer-box">
                    <div class="timer-label">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Time Remaining
                    </div>
                    <div class="timer" id="timer">00:00</div>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-info" id="progressText">0 of 0 answered</div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">

        <!-- Question Card -->
        <div class="question-card">
            <div id="questionBox"></div>
        </div>

        <!-- Navigator Panel -->
        <div class="navigator-panel">
            <div class="nav-panel-header">
                <div class="nav-panel-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="white" stroke-width="2"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="white" stroke-width="2"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="white" stroke-width="2"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="white" stroke-width="2"/>
                    </svg>
                </div>
                <div>
                    <div class="nav-panel-title">Question Navigator</div>
                    <div class="nav-panel-sub">กดหมายเลขเพื่อข้ามข้อได้ทันที</div>
                </div>
            </div>

            <div class="nav-grid" id="nav"></div>

            <div class="legend-box">
                <div class="legend-row">
                    <div class="legend-dot answered-dot"></div>
                    <span>ตอบแล้ว</span>
                </div>
                <div class="legend-row">
                    <div class="legend-dot unanswered-dot"></div>
                    <span>ยังไม่ตอบ</span>
                </div>
                <div class="legend-row">
                    <div class="legend-dot current-dot"></div>
                    <span>ข้อปัจจุบัน</span>
                </div>
            </div>

            <button class="btn-submit" onclick="submitQuiz()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                ส่งคำตอบ
            </button>
        </div>

    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/play_func.js"></script>
<script>
    (function() {
        const container = document.getElementById("particles");
        if (!container) return;
        for (let i = 0; i < 18; i++) {
            const p = document.createElement("div");
            p.className = "particle";
            const size = Math.random() * 5 + 3;
            p.style.cssText = `
                width:${size}px; height:${size}px;
                left:${Math.random()*100}%;
                top:${Math.random()*100}%;
                animation-duration:${Math.random()*10+8}s;
                animation-delay:${Math.random()*8}s;
            `;
            container.appendChild(p);
        }
    })();
</script>
</body>
</html>
